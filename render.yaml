services:
  - type: web
    name: agentshield-prototype
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    region: singapore
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 180
    buildCommand: pip install uv==0.11.26 && uv sync --frozen --no-dev && uv run --no-dev agentshield eval
    startCommand: .venv/bin/uvicorn agentshield.api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    disk:
      name: agentshield-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: AGENTSHIELD_ENV
        value: hosted
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: AGENTSHIELD_DATA_DIR
        value: /var/data/agentshield
      - key: AGENTSHIELD_ANALYZER
        value: fixture
      - key: AGENTSHIELD_OPERATOR_TOKEN
        generateValue: true
      - key: AGENTSHIELD_DEVELOPER_TOKEN
        generateValue: true
      - key: AGENTSHIELD_WORKER_TOKEN
        generateValue: true
      - key: AGENTSHIELD_REVIEWER_TOKEN
        generateValue: true
      - key: AGENTSHIELD_GITHUB_REPOSITORY
        sync: false
      - key: GITHUB_AUTH_MODE
        value: app
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_INSTALLATION_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY_PATH
        value: /etc/secrets/github-app.pem
      - key: GITHUB_ENABLE_WRITES
        value: "false"
