services:
  - type: web
    name: agentshield-prototype
    runtime: python
    plan: free
    numInstances: 1
    region: singapore
    autoDeployTrigger: checksPass
    buildCommand: pip install uv==0.11.26 && uv sync --frozen --no-dev && uv run --no-dev agentshield eval
    startCommand: .venv/bin/uvicorn agentshield.api:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      # User login uses Supabase Free. Keep the stable session secret in Render only.
      - key: SUPABASE_URL
        value: https://oanpbakftuafjikwkzzp.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: APP_BASE_URL
        value: https://agentshield-prototype.onrender.com
      - key: APP_SESSION_SECRET
        sync: false
      - key: AGENTSHIELD_OWNER_GITHUB_ID
        value: "140201744"
      - key: AGENTSHIELD_ENV
        value: hosted
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: AGENTSHIELD_DATA_DIR
        value: /tmp/agentshield
      - key: AGENTSHIELD_ANALYZER
        value: fixture
      - key: AGENTSHIELD_OPERATOR_TOKEN
        generateValue: true
      - key: AGENTSHIELD_DEVELOPER_TOKEN
        generateValue: true
      - key: AGENTSHIELD_WORKER_TOKEN
        generateValue: true
      - key: AGENTSHIELD_REVIEWER_TOKEN
        generateValue: true
      # Owner sandbox integration. User-selected repositories use App user authorization.
      # PEM and OAuth secret stay in Render.
      - key: GITHUB_APP_CLIENT_ID
        value: Iv23lirRXDuCYo785NT9
      - key: GITHUB_APP_SLUG
        value: agentshield-pgoutham47-pilot
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: AGENTSHIELD_GITHUB_REPOSITORY
        value: Pgoutham47/agentshield-github-sandbox
      - key: GITHUB_APP_ID
        value: "5366143"
      - key: GITHUB_INSTALLATION_ID
        value: "172622857"
      - key: GITHUB_PRIVATE_KEY_PATH
        value: /etc/secrets/github-app.pem
      - key: GITHUB_AUTH_MODE
        value: app
      - key: GITHUB_ENABLE_WRITES
        value: "true"
