[project]
name = "agentshield"
version = "0.1.0"
description = "Task-bound authorization for coding agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
agentshield = "agentshield.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.sdist]
include = ["/scripts", "/src", "/tests", "/docs", "/deploy", "/README.md", "/pyproject.toml", "/uv.lock", "/Makefile", "/render.yaml", "/.env.example", "/.python-version", "/.gitignore", "/.github"]
