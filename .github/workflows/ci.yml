name: Prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentshield_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: agentshield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentshield_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENTSHIELD_TEST_DATABASE_URL: postgresql://agentshield_test:local-ci-only@127.0.0.1:5432/agentshield_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.26
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run agentshield demo
      - run: uv run agentshield eval
